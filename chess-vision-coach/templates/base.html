<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Vision Coach</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body{% if session_id %} hx-headers='{"{{ session_header }}": "{{ session_id }}"}'{% endif %}>
  <header class="site-header">
    <a class="site-title" href="/">&#9818; Chess Vision Coach</a>
    <span class="site-tag">photo &rarr; FEN &rarr; best move</span>
  </header>

  <main id="app">
    {% block app %}{% endblock %}
  </main>

  <footer class="site-footer">
    Upload a top-down chessboard photo. Vision quality depends on angle and
    lighting &mdash; correct any misreads by clicking squares.
  </footer>

  <script>
    window.cvcSquare = null;

    function cvcClearSelected() {
      var sel = document.querySelectorAll('.square-btn.selected');
      for (var i = 0; i < sel.length; i++) sel[i].classList.remove('selected');
    }

    function cvcOpenPicker(evt, square) {
      evt.stopPropagation();
      window.cvcSquare = square;
      cvcClearSelected();
      evt.currentTarget.classList.add('selected');
      var picker = document.getElementById('piece-picker');
      if (!picker) return;
      var label = document.getElementById('picker-square');
      if (label) label.textContent = square;
      picker.style.display = 'block';
      var rect = evt.currentTarget.getBoundingClientRect();
      var left = window.scrollX + rect.left;
      var maxLeft = window.scrollX + document.documentElement.clientWidth
                    - picker.offsetWidth - 8;
      if (left > maxLeft) left = maxLeft;
      if (left < 8) left = 8;
      picker.style.top = (window.scrollY + rect.bottom + 6) + 'px';
      picker.style.left = left + 'px';
    }

    // Download the FEN straight from the page: no server round trip, so it
    // works even where cookies don't (e.g. inside a Hugging Face Space page).
    function cvcDownloadFen() {
      var el = document.getElementById('fen-text');
      if (!el) return;
      var blob = new Blob([el.textContent.trim() + '\n'], { type: 'text/plain' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'position.fen';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    }

    function cvcCopyFen(evt) {
      var el = document.getElementById('fen-text');
      if (!el) return;
      var text = el.textContent.trim();
      if (navigator.clipboard) navigator.clipboard.writeText(text);
      var btn = evt.target;
      var old = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(function () { btn.textContent = old; }, 1200);
    }

    document.addEventListener('click', function (e) {
      var picker = document.getElementById('piece-picker');
      if (!picker || picker.style.display !== 'block') return;
      if (e.target.closest('#piece-picker')) return;
      if (e.target.closest('.square-btn')) return;
      picker.style.display = 'none';
      cvcClearSelected();
    });

    // ---- Board corners: outline on the photo, 4 draggable dots ------------
    window.cvcCorners = null;

    function cvcCornersJSON() {
      return window.cvcCorners ? JSON.stringify(window.cvcCorners) : '';
    }

    function cvcInitCorners() {
      var wrap = document.getElementById('photo-wrap');
      if (!wrap) { window.cvcCorners = null; return; }
      var pts = null;
      try { pts = JSON.parse(wrap.getAttribute('data-corners') || 'null'); } catch (e) { pts = null; }
      if (!pts || pts.length !== 4) {
        // No board found: start from a rectangle the user can drag outward.
        pts = [[0.15, 0.15], [0.85, 0.15], [0.85, 0.85], [0.15, 0.85]];
        wrap.classList.add('editing');
      }
      window.cvcCorners = pts;
      var poly = wrap.querySelector('#board-poly');
      var handles = wrap.querySelectorAll('.corner-handle');
      var reread = document.getElementById('reread-btn');

      function clamp(v) { return Math.min(1, Math.max(0, v)); }
      function draw() {
        poly.setAttribute('points', pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' '));
        for (var i = 0; i < handles.length; i++) {
          handles[i].style.left = (pts[i][0] * 100) + '%';
          handles[i].style.top = (pts[i][1] * 100) + '%';
        }
      }
      function moved() {
        wrap.classList.add('editing');
        if (reread) reread.classList.add('btn-primary');
      }
      // Drag: track the active dot with window-level listeners rather than
      // pointer capture. With capture, the first tap after a finger drag was
      // swallowed on touch screens (Re-read board "did nothing" once) --
      // measured with real touch events.
      var active = -1;
      function onMove(e) {
        if (active < 0) return;
        var r = wrap.getBoundingClientRect();
        pts[active] = [clamp((e.clientX - r.left) / r.width), clamp((e.clientY - r.top) / r.height)];
        draw(); moved();
      }
      function onUp() {
        if (active < 0) return;
        handles[active].classList.remove('dragging');
        active = -1;
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
      }
      Array.prototype.forEach.call(handles, function (h) {
        var i = +h.getAttribute('data-i');
        h.addEventListener('pointerdown', function (e) {
          // No preventDefault(): `touch-action: none` (CSS) already stops the
          // page scrolling under a finger.
          active = i;
          h.classList.add('dragging');
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
          window.addEventListener('pointercancel', onUp);
        });
        h.addEventListener('keydown', function (e) {
          var step = e.shiftKey ? 0.02 : 0.004;
          var d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
          if (!d) return;
          e.preventDefault();
          pts[i] = [clamp(pts[i][0] + d[0]), clamp(pts[i][1] + d[1])];
          draw(); moved();
        });
      });
      draw();
    }

    document.addEventListener('DOMContentLoaded', cvcInitCorners);

    document.body.addEventListener('htmx:afterSwap', function () {
      var picker = document.getElementById('piece-picker');
      if (picker) picker.style.display = 'none';
      cvcClearSelected();
      cvcInitCorners();
    });
  </script>
</body>
</html>
